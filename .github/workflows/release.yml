# Every action below is pinned to a commit SHA, with the moved tag kept as a
# comment: tag refs are mutable, and this workflow has contents: write and
# publishes release artifacts, so a compromised action could sign or replace them.
# Bump the SHA and the "# vN" comment together.
name: Build & Release Galaxy Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK Tools
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779  # v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true
          link-to-sdk: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.10'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zipalign

      # Windows checkouts are case-insensitive, the runner is not: a mismatched
      # #include compiles locally and breaks this job.  Catch it before the
      # 20-minute native build rather than after it.
      - name: 'Verify #include case matches the tracked file names'
        run: python3 tools/check_include_case.py

      - name: Build Native Game Engine (libgame.so)
        run: |
          NDK_DIR="${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            if [ -d "/usr/local/lib/android/sdk/ndk/25.2.9519653" ]; then
              NDK_DIR="/usr/local/lib/android/sdk/ndk/25.2.9519653"
            fi
          fi
          export ANDROID_NDK_HOME="$NDK_DIR"
          export ANDROID_NDK="$NDK_DIR"
          export ANDROID_NDK_ROOT="$NDK_DIR"
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          # Pre-build shaderc static library if not present
          if [ ! -f "$ANDROID_NDK_HOME/sources/third_party/shaderc/libs/c++_static/arm64-v8a/libshaderc.a" ]; then
            echo "Compiling libshaderc.a via ndk-build..."
            "$ANDROID_NDK_HOME/ndk-build" -C "$ANDROID_NDK_HOME/sources/third_party/shaderc" \
              NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a APP_STL=c++_static APP_PLATFORM=android-30 libshaderc_combined -j$(nproc)
          fi
          mkdir -p build-mobile
          cmake -S . -B build-mobile -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DTARGET_MOBILE=ON \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C build-mobile game main reserve installer

      - name: Package Galaxy Android APK
        env:
          # The packager refuses a debuggable APK unless this is set.  It is set
          # here on purpose: Android only honours lib/<abi>/wrap.sh in a debuggable
          # app, and wrap.sh preloads libreserve.so, which reserves the game's
          # 32-bit window before ART maps its heap.  The built APK is therefore
          # debuggable and sideload-only - never publish it to a store.
          GALAXY_ALLOW_DEBUGGABLE: '1'
          # Signing material never lives in the repository, and the packager will
          # not invent a key: an APK signed with anything other than the project
          # certificate cannot update an installed copy (issues #35 and #36), so a
          # release without these secrets fails instead of shipping one.
          #   GALAXY_KEYSTORE_B64   base64 of out/release.keystore
          #                         (base64 -w0 out/release.keystore)
          #   GALAXY_KEYSTORE_PASS  its store password
          # See docs/SIGNING.md.
          GALAXY_KEYSTORE_B64: ${{ secrets.GALAXY_KEYSTORE_B64 }}
          GALAXY_KEYSTORE_PASS: ${{ secrets.GALAXY_KEYSTORE_PASS }}
        run: |
          mkdir -p out-mobile
          NDK_DIR="${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            if [ -d "/usr/local/lib/android/sdk/ndk/25.2.9519653" ]; then
              NDK_DIR="/usr/local/lib/android/sdk/ndk/25.2.9519653"
            fi
          fi
          export ANDROID_NDK_HOME="$NDK_DIR"
          export ANDROID_NDK="$NDK_DIR"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          python3 package_mobile_apk.py

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: galaxy-android-apks
          path: out-mobile/*.apk

  release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-22.04
    steps:
      - name: Download APK Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: galaxy-android-apks
          path: release-apks

      # Inspect the artifact that is actually published, not the one the
      # packager saw: signer fingerprint, native payload and debug flag.
      - name: Verify Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          # Sideload tester channel: the APK is deliberately debuggable so that
          # wrap.sh can preload libreserve.so.  See docs/SIGNING.md.
          GALAXY_ALLOW_DEBUGGABLE: '1'
        run: python3 tools/verify_release_apk.py release-apks/*.apk

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: Galaxy Android ${{ steps.vars.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          files: release-apks/*.apk
          body: |
            ### Galaxy Android ${{ steps.vars.outputs.TAG_NAME }}
            
            **100% Native ARM64 Android Port**
            
            #### Features
            - **Native Hor+ Ultrawide rendering** (Vulkan 1.0, no emulation layer)
            - **Frosted glass minimalist on-screen touch controls** with dynamic joystick & laser tether
            - **1:1 direct finger tracking** for Star Pointer & Star Bit gathering
            - **Plug-and-play Bluetooth & USB gamepad support** (Xbox, PlayStation, Switch Pro, Kishi, Backbone)
            - **Unified standalone installer & engine**
            
            #### How to Install
            1. Download `GalaxyAndroid.apk`.
            2. Follow the [Installation Guide](https://github.com/OpenPort-Labs/Galaxy-Android/blob/main/docs/INSTALLATION.md).
            
            *Legal Notice: You must provide your own legally dumped optical disc image. No proprietary assets are included.*
